name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Préparer le projet Capacitor
        run: |
          mkdir -p build/www
          cp -r index.html sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png lib build/www/
          cd build
          npm init -y >/dev/null
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor-community/background-geolocation@1.2.26 @capacitor/local-notifications@6.1.3 @capacitor/filesystem@6.0.4 @capacitor/share@6.0.4
          npx cap init "Balise" fr.navshom.app --web-dir www
          # L'app charge le site en ligne (mises à jour automatiques) ; copie locale si pas de réseau
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "fr.navshom.app",
            "appName": "Balise",
            "webDir": "www",
            "server": { "url": "https://wagido.github.io/navshom/", "errorPath": "index.html" }
          }
          JSON
          sed -i 's/^          //' capacitor.config.json
          cat capacitor.config.json
          npx cap add android
          # Autorisations GPS
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' $M
          grep -q ACCESS_FINE_LOCATION $M
          # Icône de l'app
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in $R/mipmap-*; do cp ../icon-512.png $d/ic_launcher.png; cp ../icon-512.png $d/ic_launcher_round.png; rm -f $d/ic_launcher_foreground.png; done
          # Taille du texte fixe : ignore le réglage "taille de police" d'Android (sinon tout grossit)
          cat > android/app/src/main/java/fr/navshom/app/MainActivity.java <<'JAVA'
          package fr.navshom.app;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onResume() {
                  super.onResume();
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().getSettings().setTextZoom(100);
                  }
              }
          }
          JAVA
          cat android/app/src/main/java/fr/navshom/app/MainActivity.java
          npx cap sync android

      - name: Compiler l'APK
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Balise.apk
          cp ../../Balise.apk ../../NavSHOM.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Balise-apk
          path: Balise.apk

      - name: Publier en téléchargement direct
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Balise (Android)
          body: "Fichier APK à installer sur Android. Ouvrez Balise.apk depuis le téléphone et autorisez l'installation."
          files: |
            Balise.apk
            NavSHOM.apk
          make_latest: true
